<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 - To-Do List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="card">
        <h1>회원가입</h1>

        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" th:value="${email}" required autofocus>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" minlength="4" required>
            </div>
            <div class="field">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" minlength="4" required>
            </div>
            <button type="submit" class="btn btn-block">가입하기</button>
        </form>

        <p class="helper-text">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
    </div>
</div>
</body>
</html>
