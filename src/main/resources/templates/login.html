<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인 - To-Do List</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="card">
        <h1>To-Do List</h1>

        <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" th:value="${email}" required autofocus>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-block">로그인</button>
        </form>

        <p class="helper-text">계정이 없으신가요? <a th:href="@{/register}">회원가입</a></p>
    </div>
</div>
</body>
</html>
